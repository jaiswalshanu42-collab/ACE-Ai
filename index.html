<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACE AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 18px;
      background: #181818;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      margin: 10px 0;
      padding: 12px;
      border-radius: 12px;
      max-width: 85%;
    }

    .user {
      background: #333;
      margin-left: auto;
    }

    .ace {
      background: #222;
      margin-right: auto;
    }

    .input-area {
      display: flex;
      padding: 10px;
      background: #181818;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 13px;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    button {
      padding: 13px 18px;
      border: none;
      border-radius: 10px;
      background: white;
      color: black;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    🤖 ACE
  </div>

  <div id="chat">
    <div class="message ace">
      ACE: YOOOO DUDESSS 😭🔥 I'm online.
    </div>
  </div>

  <div class="input-area">
    <input id="messageInput" placeholder="Talk to ACE...">
    <button onclick="sendMessage()">Send</button>
  </div>

</div>

<script>
function sendMessage() {

  const input = document.getElementById("messageInput");
  const chat = document.getElementById("chat");

  const message = input.value.trim();

  if (message === "") return;

  // User message
  const userMessage = document.createElement("div");
  userMessage.className = "message user";
  userMessage.textContent = "You: " + message;

  chat.appendChild(userMessage);

  input.value = "";

  // Temporary ACE brain
  const aceMessage = document.createElement("div");
  aceMessage.className = "message ace";

  let reply;

  if (message.toLowerCase().includes("yoo dudess")) {
    reply = "ACE: YOOOO DUDESSS 😭🔥";
  } 
  else if (message.toLowerCase().includes("hello") ||
           message.toLowerCase().includes("hi")) {
    reply = "ACE: Yo brooo 😭✌️";
  } 
  else if (message.toLowerCase().includes("who are you")) {
    reply = "ACE: I'm ACE 🤖 Your AI assistant.";
  } 
  else {
    reply = "ACE: I heard you 👀 My actual AI brain is coming next.";
  }

  aceMessage.textContent = reply;
  chat.appendChild(aceMessage);

  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
